<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ห้องเซอร์ไพรส์วันเกิด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Chonburi&family=Mali:wght@400;500&display=swap">
<style>
/* Layout: full-screen 3D room, objective chip top-left, controls top-right, prompts and the hold-to-blow control at the bottom.
   One committed look: a candle-lit night, so the palette stays the same in both themes. */
:root{
  color-scheme:dark;
  --night:#120f1f; --panel:rgba(24,18,38,.78); --line:rgba(247,236,230,.16);
  --text:#f7ece6; --muted:#b9adc2;
  --flame:#ffb35c; --flame-ink:#3d2306; --blush:#f29fb0;
  --paper:#fbf3e8; --ink:#2f2731; --ink-soft:#6d5f66; --brass:#a26a2e;
  --font-display:"Chonburi","Anuphan",serif;
  --font-ui:"Anuphan","Noto Sans Thai",system-ui,sans-serif;
  --font-hand:"Mali","Anuphan",cursive;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--text);font-family:var(--font-ui);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--flame);outline-offset:2px}
svg{display:block}

.hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud>*{pointer-events:auto}
.obj{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 16px 10px 10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-width:0;max-width:min(420px,70vw)}
.obj-step{flex:none;width:40px;height:40px;border-radius:50%;background:var(--flame);color:var(--flame-ink);display:grid;place-items:center;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.obj-text{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.obj-kicker{font-size:11px;color:var(--muted);letter-spacing:.04em}
.obj-main{font-size:15px;font-weight:500;text-wrap:balance}
.obj.pulse{animation:pulse .8s ease 2}
@keyframes pulse{50%{transform:scale(1.04);border-color:var(--flame)}}
.hud-actions{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.icon-btn svg{width:20px;height:20px}
.icon-btn[aria-pressed="true"]{color:var(--flame)}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 96px);z-index:6;transform:translate(-50%,-8px);opacity:0;transition:opacity .35s,transform .35s;text-align:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.t-title{font-family:var(--font-display);font-size:34px;line-height:1.35;text-shadow:0 2px 16px rgba(0,0,0,.7)}
.t-sub{font-size:15px;opacity:.9;text-shadow:0 1px 8px rgba(0,0,0,.8);margin-top:2px}

#say{position:fixed;left:0;top:0;z-index:4;max-width:min(300px,70vw);background:var(--paper);color:var(--ink);font-family:var(--font-hand);font-size:16px;line-height:1.5;padding:9px 14px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);transform:translate(-50%,-100%);opacity:0;transition:opacity .3s;pointer-events:none}
#say.show{opacity:1}
#say::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--paper);border-bottom:0}

#lyric{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 110px);transform:translateX(-50%);z-index:5;text-align:center;width:max-content;max-width:calc(100% - 32px);pointer-events:none}
.ly-line{font-family:var(--font-display);font-size:30px;line-height:1.4;text-shadow:0 2px 14px rgba(0,0,0,.8)}
.ly-line b{font-weight:400;color:var(--flame)}
.ly-skip{pointer-events:auto;margin-top:10px;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:rgba(18,15,31,.6)}

#prompt{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 16px;max-width:calc(100% - 32px);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.p-text{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.p-type{font-size:11px;color:var(--muted)}
.p-title{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-btn{flex:none;background:var(--flame);color:var(--flame-ink);font-weight:600;border-radius:999px;padding:9px 18px}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);transform:translateX(-50%);z-index:4;font-size:13px;color:var(--muted);background:rgba(18,15,31,.6);padding:7px 14px;border-radius:999px;white-space:nowrap;transition:opacity .5s;pointer-events:none}
#hint.gone{opacity:0}

#blow{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.blow-btn{position:relative;width:104px;height:104px;border-radius:50%;background:rgba(18,15,31,.7);border:1px solid var(--line);display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
.blow-btn svg.ring{position:absolute;inset:0;width:104px;height:104px;transform:rotate(-90deg)}
.blow-btn .ico{width:40px;height:40px;color:var(--flame)}
.blow-btn.active{transform:scale(.96)}
.blow-label{font-size:15px;font-weight:500;text-shadow:0 1px 8px rgba(0,0,0,.8)}
.blow-mic{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:rgba(18,15,31,.6)}
.blow-mic[aria-pressed="true"]{color:var(--flame);border-color:var(--flame)}

#sofaBar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);z-index:5}
.btn-pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 20px;font-weight:500;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

#joy{position:fixed;left:max(20px,calc(env(safe-area-inset-left,0px) + 20px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:104px;height:104px;border-radius:50%;background:rgba(18,15,31,.55);border:1px solid var(--line);touch-action:none;z-index:5}
#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(247,236,230,.85)}
@media (pointer:coarse){#prompt,#hint,#sofaBar{bottom:calc(env(safe-area-inset-bottom,0px) + 142px)}}
@media (max-width:520px){.t-title{font-size:26px}.ly-line{font-size:22px}.obj-main{font-size:14px}}

#eyes{position:fixed;inset:0;z-index:15;pointer-events:none;display:grid;place-items:center}
#eyes .lid{position:absolute;left:0;right:0;height:52%;background:#07060c;transition:transform 1s cubic-bezier(.6,0,.3,1)}
#eyes .top{top:0;transform:translateY(-100%);border-radius:0 0 50% 50% / 0 0 30% 30%}
#eyes .bot{bottom:0;transform:translateY(100%);border-radius:50% 50% 0 0 / 30% 30% 0 0}
#eyes.closed .top,#eyes.closed .bot{transform:none}
#eyes .eyes-text{position:relative;font-family:var(--font-display);font-size:26px;opacity:0;transition:opacity .6s .5s;text-align:center;padding:0 24px}
#eyes.closed .eyes-text{opacity:1}

#start{position:fixed;inset:0;z-index:30;display:grid;place-items:center;overflow:auto;background:radial-gradient(ellipse at 50% 30%,#2a1e3a 0%,var(--night) 70%);
  padding-block:calc(env(safe-area-inset-top,0px) + 24px) calc(env(safe-area-inset-bottom,0px) + 24px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:opacity .7s}
#start.leave{opacity:0;pointer-events:none}
.start-wrap{width:min(420px,100%)}
.invite{position:relative;width:100%;background:var(--paper);color:var(--ink);border-radius:6px;padding:34px 30px 26px;box-shadow:0 30px 80px rgba(0,0,0,.5);text-align:center}
.invite::before{content:"";position:absolute;inset:10px;border:1px solid rgba(162,106,46,.45);border-radius:3px;pointer-events:none}
.inv-kicker{font-size:12px;letter-spacing:.14em;color:var(--brass);font-weight:600}
.inv-title{font-family:var(--font-display);font-size:36px;line-height:1.4;margin:12px 0 6px;text-wrap:balance}
.inv-body{font-family:var(--font-hand);font-size:17px;line-height:1.7;color:var(--ink-soft);margin:0 auto;max-width:30ch}
.inv-meta{display:flex;justify-content:center;gap:22px;margin:20px 0 22px;font-size:13px;color:var(--ink-soft)}
.inv-meta b{display:block;color:var(--ink);font-size:15px;font-weight:600;margin-top:2px}
.btn-primary{background:var(--ink);color:var(--paper);font-weight:600;border-radius:999px;padding:13px 26px}
.btn-primary:disabled{opacity:.55;cursor:progress}
.btn-flame{background:var(--flame);color:var(--flame-ink);font-weight:600;border-radius:999px;padding:12px 22px}
.btn-ghost{border:1.5px solid currentColor;border-radius:999px;padding:10px 18px;font-weight:500;opacity:.85}
.start-hint{font-size:13px;color:var(--muted);text-align:center;line-height:1.7;margin-top:18px}

#modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scrim{position:absolute;inset:0;background:rgba(8,6,14,.78);opacity:0;transition:opacity .3s}
#modal.show .scrim{opacity:1}
.sheet{position:relative;width:100%;max-height:100%;overflow:auto;border-radius:18px;opacity:0;transform:translateY(14px) scale(.98);transition:opacity .3s,transform .3s}
#modal.show .sheet{opacity:1;transform:none}
.sheet .x{position:absolute;top:10px;right:10px;z-index:4}
.sheet-card{max-width:560px;background:var(--paper);color:var(--ink);padding:28px 28px 24px}
.sheet-card .x{color:var(--ink);background:transparent;border-color:rgba(47,39,49,.18)}
.card-kicker{font-size:12px;letter-spacing:.12em;color:var(--brass);font-weight:600;margin:0}
.card-title{font-family:var(--font-display);font-size:30px;line-height:1.35;margin:6px 0 8px;text-wrap:balance}
.card-body{color:var(--ink-soft);line-height:1.75;margin:0}
.wish-input{width:100%;margin-top:16px;min-height:96px;resize:vertical;border:1.5px solid rgba(47,39,49,.2);border-radius:12px;padding:12px 14px;font-family:var(--font-hand);font-size:17px;background:#fffaf2;color:var(--ink)}
.wish-input:focus{outline:2px solid var(--flame);outline-offset:1px}
.wish-note{font-size:12px;color:var(--ink-soft);margin:8px 0 0}
.card-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.gift-img{width:100%;border-radius:10px;margin:14px 0 4px;box-shadow:0 10px 30px rgba(0,0,0,.18)}

.sheet-photo{max-width:1060px;background:#1c1628;border:1px solid var(--line)}
.ph{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.ph-stage{background:#0c0a14;display:grid;place-items:center;padding:28px 56px;min-height:320px;position:relative;touch-action:pan-y}
.ph-stage img{max-height:68vh;width:auto;max-width:100%;border:10px solid #f6eedf;box-shadow:0 20px 50px rgba(0,0,0,.5);user-select:none;-webkit-user-drag:none}
.ph-nav{position:absolute;top:50%;transform:translateY(-50%)}
.ph-prev{left:10px}.ph-next{right:10px}
.ph-info{padding:30px 26px 26px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ph-kicker{font-size:12px;letter-spacing:.06em;color:var(--flame)}
.ph-title{font-family:var(--font-display);font-size:28px;line-height:1.35;margin:0;text-wrap:balance}
.ph-meta{color:var(--muted);font-size:14px}
.ph-cap{font-size:16px;line-height:1.75;margin:6px 0 0;max-width:40ch}
.ph-foot{margin-top:auto;padding-top:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.chip{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
@media (max-width:760px){.ph{grid-template-columns:1fr}.ph-stage{padding:20px 48px;min-height:0}.ph-stage img{max-height:46vh;border-width:7px}.ph-info{padding:20px 20px 22px}.ph-title{font-size:24px}}

.sheet-letter{max-width:660px}
.env-stage{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 12px 34px;text-align:center}
.env-kicker{font-size:13px;letter-spacing:.06em;color:var(--muted)}
.env{position:relative;width:min(320px,78vw);aspect-ratio:1.5;perspective:900px;margin-top:40px}
.env>*{position:absolute;border-radius:6px}
.env-back{inset:0;background:var(--env);filter:brightness(.78)}
.env-paper{left:7%;right:7%;top:8%;bottom:6%;background:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0 13px,rgba(80,60,40,.14) 13px 14px);z-index:1;transition:transform .9s .35s cubic-bezier(.2,.8,.2,1)}
.env-front{inset:0;background:var(--env);clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);z-index:2}
.env-flap{left:0;right:0;top:0;height:58%;background:var(--env);filter:brightness(1.1);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transition:transform .6s ease;z-index:3}
.env-seal{left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%!important;background:#a8333f;color:#f6d7d0;display:grid;place-items:center;z-index:4;transition:opacity .25s}
.env-seal svg{width:22px;height:22px}
.env.open .env-flap{transform:rotateX(180deg);z-index:0}
.env.open .env-seal{opacity:0}
.env.open .env-paper{transform:translateY(-52%)}
.env-title{font-family:var(--font-display);font-size:26px;margin:12px 0 4px;text-wrap:balance}
.paper{background-color:var(--paper);color:var(--ink);background-image:repeating-linear-gradient(to bottom,transparent 0 35px,rgba(80,60,40,.13) 35px 36px);background-position:0 70px;border-radius:8px;padding:30px 34px 26px;box-shadow:0 30px 70px rgba(0,0,0,.45);cursor:pointer}
.paper-kicker{font-size:12px;letter-spacing:.08em;color:var(--brass);font-weight:600;margin:0 0 14px}
.paper-body{font-family:var(--font-hand);font-size:20px;line-height:36px;white-space:pre-wrap;min-height:180px}
.paper-sign{font-family:var(--font-hand);font-size:22px;text-align:right;margin:14px 0 0;opacity:0;transition:opacity .6s}
.paper.done .paper-sign{opacity:1}
.paper-skip{font-size:12px;color:var(--ink-soft);text-align:center;margin:10px 0 0;transition:opacity .4s}
.paper.done .paper-skip{opacity:0}
.sheet-letter .x{color:var(--ink);background:rgba(251,243,232,.9);border-color:rgba(47,39,49,.15)}
.sheet-letter.env-mode .x{color:var(--text);background:var(--panel);border-color:var(--line)}
@media (max-width:520px){.paper{padding:24px 20px 20px;background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(80,60,40,.13) 31px 32px)}.paper-body{font-size:18px;line-height:32px}}

.sheet-end{max-width:520px;background:var(--paper);color:var(--ink);padding:26px 26px 22px;text-align:center}
.sheet-end .x{color:var(--ink);background:transparent;border-color:rgba(47,39,49,.18)}
.souvenir{width:auto;max-width:100%;max-height:46vh;margin:16px auto 6px;display:block;box-shadow:0 14px 34px rgba(0,0,0,.22);transform:rotate(-1.5deg)}
.end-note{font-size:12px;color:var(--ink-soft);margin:8px 0 0}
.end-actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation-duration:.01s!important}}
</style>

<!-- ============================================================
     ข้อมูลลูกค้า 1 ราย: แก้เฉพาะในบล็อกนี้
     - to = คนเกิด (ผู้เล่น) · from = คนให้ (ตัวละครที่รอเซอร์ไพรส์)
     - candles: { type: "number", age: 25 } เทียนตัวเลข หรือ { type: "classic", count: 8 } เทียนเล่มเล็ก
     - cake.flavor: strawberry | chocolate | matcha | vanilla · cake.text: ข้อความบนเค้ก ไม่เกิน 15 ตัวอักษร
     - room: cozy | pastel | city
     - photos: 1–6 รูป รูปแรกเป็นกรอบใหญ่บนชั้น (src: "photos/01.jpg"; ไม่ใส่ src = วาดภาพตัวอย่างจาก art)
     - gift: ของขวัญในกล่อง (link = ปุ่มเปิดลิงก์ภายนอก เช่น YouTube) (ไม่ใส่ = มีแค่จดหมาย) · video: { src } วิดีโออวยพรบนทีวี (ไม่ใส่ = สไลด์รูป)
     ============================================================ -->
<script>
window.BIRTHDAY_CONFIG = {
  id: "hedgehog-lin-26",
  to: "เม่น",
  from: "ลิน",
  birthday: "2026-11-06",
  candles: { type: "number", age: 26 },
  cake: { flavor: "chocolate", text: "ขอให้อยู่ด้วยกันไปนานๆ" },
  room: "cozy",
  characters: {
    recipient: { gender: "male", hair: "short", hairColor: "#1d1816", outfit: "#7fb6e6", pants: "#2f3a4f", skin: "#f3d6bf" },
    buyer:     { gender: "female", hair: "long", hairColor: "#1d1816", outfit: "#f2a0bb", skin: "#f3d6bf" }

helpBtn.addEventListener('click', () => { const b = openModal('card', `<p class="card-kicker">วิธีเล่น</p><h2 class="card-title">เดินสำรวจห้อง</h2><p class="card-body">${coarse ? 'แตะพื้นเพื่อเดิน หรือใช้จอยซ้ายล่าง ลากหน้าจอเพื่อหมุนกล้อง แตะสิ่งของเพื่อเดินไปหาและใช้งาน' : 'เดินด้วย WASD หรือปุ่มลูกศร คลิกพื้นเพื่อเดินไปตรงนั้น ลากเมาส์เพื่อหมุนกล้อง เลื่อนล้อเมาส์เพื่อซูม กด E เพื่อใช้งานสิ่งของ'}<br><br>ทำตามภารกิจที่มุมซ้ายบนไปทีละขั้น มีลูกศรสีส้มชี้ให้ว่าต้องไปที่ไหน</p><div class="card-actions"><button class="btn-flame" id="hOk">เข้าใจแล้ว</button></div>`); b.querySelector('#hOk').addEventListener('click', () => closeModal()); });

/* ---------- render loop ---------- */
const tv3 = V3(0, 0, 0);
function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w / h < .8 ? 68 : 55; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let lastT = performance.now(), clock = 0;
function frame(now){
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now; clock += dt;
  if (player){
    updPlayerInput(dt);
    if (player.goal || player.slide){ stepChar(player, dt); }
    else { const mv = player._mv; if (mv) faceYaw(player, Math.atan2(mv[0], mv[1]), dt); else { let d = player.yaw - player.root.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); player.root.rotation.y += d * Math.min(1, dt * 6); } animHuman(player, dt, !!mv, 1.9); }
    if (partner.root.visible) stepChar(partner, dt);
    const pp = player.root.position, last = trail[trail.length - 1]; if (!last || Math.hypot(last.x - pp.x, last.z - pp.z) > .08){ trail.push({ x: pp.x, z: pp.z }); if (trail.length > 80) trail.shift(); }
    // lights
    const k = 1 - Math.exp(-dt * 2.6);
    for (const n in L) L[n] += (lightTarget[n] - L[n]) * k;
    hemi.intensity = L.hemi; key.intensity = L.key; pendLight.intensity = L.pend * .8; lampLight.intensity = L.lamp; moon.intensity = L.moon;
    PEND.material.color.setRGB(.1 + L.pend * 1.0, .09 + L.pend * .95, .08 + L.pend * .85); LAMPSHADE.material.emissiveIntensity = L.lamp * .9;
    if (Math.abs(L.env - lastEnv) > .005){ lastEnv = L.env; MATS.forEach(m => { m.envMapIntensity = m.userData.envBase * L.env; }); }
    { const v = L.fairy * (.88 + Math.sin(clock * 2.2) * .12); FAIRY.bulbMat.color.setRGB(.16 + v * .9, .12 + v * .7, .08 + v * .35); FAIRY.glow.material.opacity = v * .65; }
    // candles
    let flick = 0; CAKE.flames.forEach((f, i) => { const u = f.fl.material.uniforms; u.uTime.value = clock; u.uLean.value = CAKE.lean; f.alpha += ((CAKE.lit && !f.out && f.fl.visible ? 1 : 0) - f.alpha) * Math.min(1, dt * (f.out ? 14 : 4)); u.uAlpha.value = f.alpha; f.glow.material.opacity = f.alpha * (.55 + Math.sin(clock * 13 + i) * .08) * (1 - CAKE.lean * .4); f.fl.rotation.y = Math.atan2(camera.position.x - f.x, camera.position.z - f.z); flick += f.alpha; });
    const fl = CAKE.flames.length ? flick / CAKE.flames.length : 0; candleLight.intensity = fl * (1.7 + Math.sin(clock * 14) * .12 + Math.sin(clock * 23.7) * .08) * (1 - CAKE.lean * .5);
    // switch led blink
    if (step === 'dark') SW.ledGlow.material.opacity = .5 + Math.sin(clock * 4) * .3; else SW.ledGlow.material.opacity = .15;
    // gift
    if (GIFTBOX.opening && GIFTBOX.open < 1){ GIFTBOX.open = Math.min(1, GIFTBOX.open + dt * 1.6); const u = GIFTBOX.open; GIFTBOX.lid.position.set(-.05 * u, .3 + Math.sin(u * Math.PI) * .25 + u * .02, .26 * u); GIFTBOX.lid.rotation.x = u * 1.6; }
    // balloons
    BALLOONS.forEach(b => { b.grp.position.x = b.base.x + Math.sin(clock * .6 + b.ph) * .03; b.grp.position.y = b.base.y + Math.sin(clock * .9 + b.ph) * .02; b.grp.rotation.z = Math.sin(clock * .7 + b.ph) * .05; const a = b.str.geometry.attributes.position; a.setXYZ(0, b.grp.position.x, b.grp.position.y - .21, b.grp.position.z); a.setXYZ(1, b.anchor.x, b.anchor.y, b.anchor.z); a.needsUpdate = true; });
    // clock
    const d = new Date(), s = d.getSeconds() + d.getMilliseconds() / 1000, m = d.getMinutes() + s / 60, h = (d.getHours() % 12) + m / 60;
    CLOCK.s.rotation.x = -s / 60 * TAU; CLOCK.m.rotation.x = -m / 60 * TAU; CLOCK.h.rotation.x = -h / 12 * TAU;
    // marker
    const tk = stepTarget(); if (tk && started && !busy && !modalState && !inSofa){ marker.visible = true; const mp = INTER[tk].mark; marker.position.set(mp.x, mp.y + Math.sin(clock * 3) * .06, mp.z); } else marker.visible = false;
    updBlow(dt); updConfetti(dt); updSmoke(dt); updFireworks(dt);
    if (tvPlay && !tvPlay.video){ tvPlay.t += dt; if (drawTV(tvPlay.t) && !tvPlay.ended){ tvPlay.ended = true; setTimeout(standUp, 1500); } }
    else if (tvPlay && tvPlay.video && tvPlay.ended){ tvPlay = null; setTimeout(standUp, 800); }
    TV.light.intensity = tvPlay ? .7 + Math.sin(clock * 3) * .15 : 0;
    updCamera(dt); updProximity();
    if (sayEl.classList.contains('show') && sayWho){ tv3.copy(sayWho.root.position); tv3.y += 1.5; tv3.project(camera); sayEl.style.left = clamp((tv3.x * .5 + .5) * innerWidth, 170, innerWidth - 170) + 'px'; sayEl.style.top = clamp((-tv3.y * .5 + .5) * innerHeight, 150, innerHeight - 120) + 'px'; }
  }
  renderer.render(scene, camera);
  if (captureNext){ captureNext = false; try { const im = new Image(); im.src = renderer.domElement.toDataURL('image/jpeg', .92); snapshot = im; } catch (e) {} }
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
async function boot(){
  $('#invTitle').textContent = 'สุขสันต์วันเกิด ' + CFG.to;
  $('#invBody').textContent = `มีบางอย่างรอ${CFG.to}อยู่ในห้อง เปิดประตูเข้ามาได้เลย`;
  $('#invDate').textContent = fmtDate(CFG.birthday, { day: 'numeric', month: 'short', year: 'numeric' }) || 'วันนี้';
  if (coarse) $('#startHint').textContent = 'เปิดเสียงด้วยนะ · แตะพื้นเพื่อเดิน · ลากหน้าจอเพื่อหมุนกล้อง';
  try { await Promise.race([Promise.all(['64px "Chonburi"', '500 30px "Mali"', '600 30px "Anuphan"', '30px "Anuphan"'].map(f => document.fonts.load(f, 'กขค'))), wait(3000)]); } catch (e) {}
  await preloadPhotos();
  buildShell(); buildFurniture(); buildFrames(); buildCake(); buildGrid(); mergeStatic();
  const ch = CFG.characters || {};
  player = makeHuman(ch.recipient || { gender: 'female', hair: 'long' }, CFG.to);
  partner = makeHuman(ch.buyer || { gender: 'male', hair: 'short' }, CFG.from);
  player.root.position.set(-2.8, 0, 2.55); player.yaw = Math.PI; player.root.rotation.y = Math.PI;
  partner.root.position.set(TABLE.x + .82, 0, TABLE.z + .35); partner.root.visible = false;
  camPos.set(-2.8 + Math.sin(camYaw) * camDist, 1.1 + camDist * .55, 2.55 + Math.cos(camYaw) * camDist); camLook.set(-2.8, .95, 2.55);
  const btn = $('#enterBtn'); btn.disabled = false; btn.textContent = 'เปิดประตูเข้าห้อง'; btn.addEventListener('click', enter);
}
function enter(){
  Sound.resume();
  $('#start').classList.add('leave'); setTimeout(() => { $('#start').hidden = true; }, 700);
  $('#hud').hidden = false; $('#hint').hidden = false; if (coarse) $('#joy').hidden = false;
  started = true; setStep('dark'); canvas.focus({ preventScroll: true });
  setTimeout(() => toast('กลับถึงห้องแล้ว', 'ทำไมไฟดับล่ะ… ลองหาสวิตช์ไฟดูนะ', 3400), 900);
  setTimeout(() => $('#hint').classList.add('gone'), 9000);
}
requestAnimationFrame(frame);
boot();
</script>
